[package]
name = "cubacle-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
publish = false
description = "Stateless HTTP backend for the cubacle cube solvers"

[lib]
name = "cubacle_server"
path = "src/lib.rs"

[[bin]]
name = "cubacle-server"
path = "src/main.rs"

[dependencies]
cubacle = { path = "../.." }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["server", "server-graceful", "http1", "tokio", "service"] }
clap = { version = "4.6.7", features = ["derive", "env"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util"] }

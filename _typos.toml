# Spelling check: American English only (run as `typos --locale en-us`).
[files]
extend-exclude = [
  ".git/",
  ".claude/",
  "target/",
  "LICENSE",
  "LICENSE-MIT",
  "licenses/",
  "Cargo.lock",
  "tests/fixtures/",
  "docs/static/",
  "tests/canonical_vectors.txt",
]

[default]
extend-ignore-re = [
  # hex and base64 blobs
  "[0-9a-fA-F]{32,}",
]

[default.extend-words]
# known false positives (cube notation, abbreviations, data)
oll = "oll"
nd = "nd"
TRU = "TRU"
fo = "fo"
ba = "ba"
mis = "mis"
# German header word in the import tests, and a lo/hi pair in the renderer
unter = "unter"
alo = "alo"

# British words that `--locale en-us` does not flag on its own
catalogue = "catalog"
catalogues = "catalogs"

# SPDX-License-Identifier: AGPL-3.0-or-later
# An owner-pushed tag vMAJOR.MINOR.PATCH publishes a release with prebuilt archives
# (macOS arm64 and Intel, Linux x86_64 and arm64), a SHA256SUMS file and build provenance.
# A manual run is a dry run that builds and smoke-tests the archives but never publishes.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin_arm64
            runner: macos-15
          - target: darwin_amd64
            runner: macos-15-intel
          - target: linux_amd64
            runner: ubuntu-24.04
          - target: linux_arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --release --locked --bins --workspace
      - name: Package the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="cubacle"))')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2; exit 1; }
          fi
          name="cubacle_${version}_${TARGET}"
          mkdir -p "dist/$name"
          cp target/release/cubacle target/release/cubacle-server LICENSE LICENSE-MIT NOTICE.md README.md "dist/$name/"
          (cd dist && tar -czf "$name.tar.gz" "$name" && rm -r "$name")
          if command -v sha256sum >/dev/null; then (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"); else (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"); fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin_arm64
            runner: macos-15
          - target: darwin_amd64
            runner: macos-15-intel
          - target: linux_amd64
            runner: ubuntu-24.04
          - target: linux_arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist
      - name: Smoke-test the shipped archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archive=$(ls cubacle_*_${{ matrix.target }}.tar.gz)
          if command -v sha256sum >/dev/null; then sha256sum --check "$archive.sha256"; else shasum -a 256 --check "$archive.sha256"; fi
          mkdir x && tar -xzf "$archive" -C x
          bin=$(ls -d x/cubacle_*)/cubacle
          "$bin" --version
          out=$("$bin" solve --scramble "R U R' U'" 2>&1)
          echo "$out"
          echo "$out" | grep -q '^moves '

  publish:
    name: publish
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(ls -1 -- *.tar.gz | wc -l)" -eq 4
          cat -- *.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          rm -- *.sha256
          sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/cubacle_*.tar.gz
            dist/SHA256SUMS
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "cubacle $TAG" --generate-notes dist/cubacle_*.tar.gz dist/SHA256SUMS

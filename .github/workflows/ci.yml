# SPDX-License-Identifier: AGPL-3.0-or-later
# Checks for develop and pull requests against develop.
# The msrv job builds with the rust-version of Cargo.toml (1.95, forced by sysinfo 0.39).
# The spelling job runs typos --locale en-us (American English, see AGENTS.md).
# The notes job validates notes/ with the pinned ChartScribe release (checksum and build attestation verified when pinning).
# The changes job classifies a pull request: when every changed path is documentation
# (docs/ except docs/static/ and docs/examples.toml, notes/, site/, top-level *.md),
# the Rust jobs rust, five-full, four-full and msrv are skipped. Pushes and manual runs
# always run everything. The ci-result job always runs and fails unless every job passed
# or was skipped by that rule: it is the one check to require for merging.
name: ci
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # the pull request merge commit and its first parent, the base it is tested on
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the changed paths
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            # --no-renames lists both sides of a move; -z keeps unusual names intact
            git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            code=false
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              case "$path" in
                docs/static/* | docs/examples.toml) kind=code ;;
                docs/* | notes/* | site/*) kind=docs ;;
                */*) kind=code ;;
                *.md) kind=docs ;;
                *) kind=code ;;
              esac
              echo "$kind $path"
              [ "$kind" = docs ] || code=true
            done < "$RUNNER_TEMP/changed"
            [ "$count" -gt 0 ] || code=true
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release
  five-full:
    name: five-full
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUBACLE_CACHE_DIR: ${{ github.workspace }}/target/tmp/five-full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the 5x5x5 tables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tmp/five-full
          # any change to the engine or to the shared reduction code may change
          # the tables (tables.rs also holds the format version)
          key: five-tables-${{ hashFiles('src/engines/five/**', 'src/reduction/**') }}
      - name: Full-table tests
        run: cargo test --release -- --ignored five_full
  four-full:
    name: four-full
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the 4x4x4 tables (12 MB) are built in well under a second: no cache
      - name: Heavy 4x4x4 tests
        run: cargo test --release --lib --test four_test -- --ignored four_full
  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check on the declared minimum Rust version
        run: |
          set -euo pipefail
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 check --workspace --all-targets
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hugo"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo/hugo.tar.gz" https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_0.168.0_linux-amd64.tar.gz
          echo 'fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594  '"$RUNNER_TEMP/hugo/hugo.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/hugo/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
      - name: Build the docs site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          cp site/hugo.toml "$RUNNER_TEMP/site/hugo.toml"
          cp -r site/layouts "$RUNNER_TEMP/site/layouts"
          cp -r docs "$RUNNER_TEMP/site/content"
          cp -r docs/static "$RUNNER_TEMP/site/static"
          HUGO_CACHEDIR="$RUNNER_TEMP/hugo-cache" "$RUNNER_TEMP/hugo/hugo" --source "$RUNNER_TEMP/site" --destination "$RUNNER_TEMP/public" --noBuildLock --quiet
          test -s "$RUNNER_TEMP/public/index.html"
  notes:
    name: notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned ChartScribe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cscribe"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cscribe/cscribe.tar.gz" https://github.com/wstein/chartscribe/releases/download/v0.1.0/cscribe_0.1.0_linux_amd64.tar.gz
          echo 'b8941a418cec616df6d142d1008dd0bef7c8aea98c32911b724620e666a572cf  '"$RUNNER_TEMP/cscribe/cscribe.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cscribe/cscribe.tar.gz" -C "$RUNNER_TEMP/cscribe"
          "$RUNNER_TEMP/cscribe/cscribe_0.1.0_linux_amd64/cscribe" version
      - name: Validate the notes
        run: '"$RUNNER_TEMP/cscribe/cscribe_0.1.0_linux_amd64/cscribe" validate'
  spelling:
    name: spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: American English (typos, config in _typos.toml)
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          args: --locale en-us
  ci-result:
    name: ci-result
    needs: [changes, rust, five-full, four-full, msrv, docs, notes, spelling]
    # always(): a skipped or cancelled aggregate would count as passing for a required check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped for a documentation-only change
        shell: bash
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust.result }}
          FIVE_FULL: ${{ needs.five-full.result }}
          FOUR_FULL: ${{ needs.four-full.result }}
          MSRV: ${{ needs.msrv.result }}
          DOCS: ${{ needs.docs.result }}
          NOTES: ${{ needs.notes.result }}
          SPELLING: ${{ needs.spelling.result }}
        run: |
          set -euo pipefail
          status=0
          check() { # name result allowed...
            local name=$1 result=$2 ok
            shift 2
            for ok in "$@"; do [ "$result" = "$ok" ] && { echo "$name: $result"; return 0; }; done
            echo "::error::$name: $result"
            status=1
          }
          check changes "$CHANGES" success
          for name in docs notes spelling; do
            var=${name^^}
            check "$name" "${!var}" success
          done
          if [ "$CHANGES" = success ] && [ "$CODE" = false ]; then heavy=(success skipped); else heavy=(success); fi
          check rust "$RUST" "${heavy[@]}"
          check five-full "$FIVE_FULL" "${heavy[@]}"
          check four-full "$FOUR_FULL" "${heavy[@]}"
          check msrv "$MSRV" "${heavy[@]}"
          exit "$status"

# SPDX-License-Identifier: AGPL-3.0-or-later
# Checks for develop and pull requests against develop.
# The msrv job builds with the rust-version of Cargo.toml (1.95, forced by sysinfo 0.39).
# The notes job validates notes/ with the pinned ChartScribe release (checksum and build attestation verified when pinning).
name: ci
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release
  five-full:
    name: five-full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUBACLE_CACHE_DIR: ${{ github.workspace }}/target/tmp/five-full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the 5x5x5 tables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tmp/five-full
          # any change to the engine or to the shared reduction code may change
          # the tables (tables.rs also holds the format version)
          key: five-tables-${{ hashFiles('src/engines/five/**', 'src/reduction/**') }}
      - name: Full-table tests
        run: cargo test --release -- --ignored five_full
  four-full:
    name: four-full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the 4x4x4 tables (12 MB) are built in well under a second: no cache
      - name: Heavy 4x4x4 tests
        run: cargo test --release --lib --test four_test -- --ignored four_full
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check on the declared minimum Rust version
        run: |
          set -euo pipefail
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 check --workspace --all-targets
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hugo"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo/hugo.tar.gz" https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_0.168.0_linux-amd64.tar.gz
          echo 'fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594  '"$RUNNER_TEMP/hugo/hugo.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/hugo/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
      - name: Build the docs site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          cp site/hugo.toml "$RUNNER_TEMP/site/hugo.toml"
          cp -r site/layouts "$RUNNER_TEMP/site/layouts"
          cp -r docs "$RUNNER_TEMP/site/content"
          cp -r docs/static "$RUNNER_TEMP/site/static"
          HUGO_CACHEDIR="$RUNNER_TEMP/hugo-cache" "$RUNNER_TEMP/hugo/hugo" --source "$RUNNER_TEMP/site" --destination "$RUNNER_TEMP/public" --noBuildLock --quiet
          test -s "$RUNNER_TEMP/public/index.html"
  notes:
    name: notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned ChartScribe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cscribe"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cscribe/cscribe.tar.gz" https://github.com/wstein/chartscribe/releases/download/v0.1.0/cscribe_0.1.0_linux_amd64.tar.gz
          echo 'b8941a418cec616df6d142d1008dd0bef7c8aea98c32911b724620e666a572cf  '"$RUNNER_TEMP/cscribe/cscribe.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cscribe/cscribe.tar.gz" -C "$RUNNER_TEMP/cscribe"
          "$RUNNER_TEMP/cscribe/cscribe_0.1.0_linux_amd64/cscribe" version
      - name: Validate the notes
        run: '"$RUNNER_TEMP/cscribe/cscribe_0.1.0_linux_amd64/cscribe" validate'

[package]
name = "cubacle"
authors = ["Werner Stein", "Chen Shuang <cs0x7f@gmail.com>"]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
keywords = ["rubik", "cubing", "solver", "kociemba", "cube-explorer"]
readme = "README.md"
description = "Rubik's cube solver and generator, 2x2 to 7x7: a two-phase 3x3 core, a size-independent solver facade and a backend for cube explorers"
documentation = "https://wstein.github.io/cubacle"
repository = "https://github.com/wstein/cubacle"

[dependencies]
# Fixed-frame wire input and certificate hashes (design decision D2).
serde = { version = "1.0.228", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = "0.11.1"
rand = "0.10.3"
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
# Physical and available memory, to size the tables of --optimal.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"], optional = true }
# The only network code: `cubacle patterns update`. Optional so that the server never gets it.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"], optional = true }

[features]
default = ["fetch", "cli"]
# The command line program: argument parsing, the memory probe and the configuration reader.
# The server and the browser module depend on cubacle without it.
cli = ["dep:clap", "dep:sysinfo", "dep:toml"]
# Downloads of pattern sources (the CLI only; the server depends on cubacle without it).
fetch = ["dep:ureq", "cli"]
# Draws an amber frame around a lone quarter turn in the Kitty rows of `--icons`.
quarter-frame = []

[[bin]]
name = "cubacle"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "five_compare"
path = "tools/bench/five_compare.rs"

[[example]]
name = "kind_rates"
path = "tools/bench/kind_rates.rs"

[[example]]
name = "four_compare"
path = "tools/bench/four_compare.rs"

[[example]]
name = "orbit64_v2_picture_diff"
path = "tools/orbit64_v2_picture_diff/main.rs"

[[example]]
name = "picture_render_fixtures"
path = "tools/picture_render_fixtures.rs"

[[example]]
name = "probes_big"
path = "tools/bench/probes_big.rs"

[profile.release]
codegen-units = 1
lto = "fat"

[workspace]
members = ["crates/server", "crates/wasm", "xtask"]

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["termios"] }

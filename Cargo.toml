[package]
name = "cubacle"
authors = ["Werner Stein", "Chen Shuang <cs0x7f@gmail.com>"]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
keywords = ["rubik", "cubing", "solver", "kociemba", "cube-explorer"]
readme = "README.md"
description = "Rubik's cube solver and generator, 2x2 to 7x7: a two-phase 3x3 core, a size-independent solver facade and a backend for cube explorers"
documentation = "https://wstein.github.io/cubacle"
repository = "https://github.com/wstein/cubacle"

[dependencies]
rand = "0.10.3"
clap = { version = "4.6.7", features = ["derive"] }

[[example]]
name = "five_compare"
path = "tools/bench/five_compare.rs"

[profile.release]
codegen-units = 1
lto = "fat"

[workspace]
members = ["crates/server"]
